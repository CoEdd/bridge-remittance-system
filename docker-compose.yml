name: bridge

services:
  backend:
    # Built from the repo root so the image can include demo-docs/.
    build:
      context: .
      dockerfile: backend/Dockerfile
    # .env is optional: without it the backend uses the defaults shown in .env.example.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bridge-data:/app/data
    # Healthy once /health answers. The frontend waits for this before it starts.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js inlines NEXT_PUBLIC_* values when it builds, so this is a build argument.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    # Start only when the backend is ready, so the first page never shows "could not be reached".
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Holds the SQLite file (DATABASE_URL points at ./data inside the backend container).
  bridge-data:
